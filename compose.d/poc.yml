# Runs generated verification PoCs: no Docker socket, read-only, no
# capabilities.  Its image is built from the protected code too; the licence is
# mounted read-only because the container cannot write /key.
#
# Enabled by FEATURE_POC_WORKER in the product manifest; the installer adds this
# file to COMPOSE_FILE in .env.

services:

  worker_poc:
    image: ${IMAGE_PREFIX:-appsec4u}/${IMAGE_POC:-worker-poc}:${SCANSUITE_TAG:?run ./scansuite install <code> first}
    command: python /app/work_poc.py
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./key:/key:ro
    environment:
      PS_DATABASE_HOST: ${PS_DATABASE_HOST:-postgres}
      PS_DATABASE_NAME: ${PS_DATABASE_NAME:-scansuite}
      PS_DATABASE_PASSWORD: ${PS_DATABASE_PASSWORD:-secure_password}
      PS_DATABASE_PORT: ${PS_DATABASE_PORT:-5432}
      PS_DATABASE_USER: ${PS_DATABASE_USER:-scansuite}
      CELERY_HOST: ${CELERY_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_secure_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
